<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Access</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* हल्का Telegram-स्टाइल बैकग्राउंड पैटर्न */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(36, 161, 222, 0.14) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      pointer-events: none;
      z-index: 0;
    }

    .tg-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tg-notice {
      background: linear-gradient(135deg, #f4faff 0%, #eaf6fd 100%);
      border: 1.5px solid #cde8f9;
      border-radius: 14px;
      padding: 13px 16px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(36, 161, 222, 0.08);
    }

    .tg-notice-badge {
      display: inline-block;
      background-color: #24a1de;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .tg-notice-text {
      font-size: 14px;
      font-weight: 700;
      color: #17212b;
      line-height: 1.4;
    }

    .tg-notice-text span {
      color: #1c93d2;
    }

    .tg-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tg-btn {
      width: 100%;
      padding: 15px 18px;
      background: #ffffff;
      border: 1.5px solid #e3eff7;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(36, 161, 222, 0.08);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background-color 0.16s ease;
    }

    .tg-btn:hover {
      background-color: #f4faff;
      border-color: #24a1de;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(36, 161, 222, 0.16);
    }

    .tg-btn:active {
      transform: scale(0.99);
    }

    .tg-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .tg-badge {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #37aee2 0%, #1e96c8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(36, 161, 222, 0.28);
    }

    .tg-badge svg {
      width: 21px;
      height: 21px;
      fill: #ffffff;
      transform: translateX(-1px);
    }

    .tg-title {
      font-size: 15.5px;
      font-weight: 600;
      color: #17212b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tg-action {
      background-color: #eaf6fd;
      color: #1c93d2;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
      transition: background-color 0.16s ease, color 0.16s ease;
    }

    .tg-btn:hover .tg-action {
      background-color: #24a1de;
      color: #ffffff;
    }

    .tg-btn.unlocked {
      border-color: #24a1de;
    }

    .tg-btn.unlocked .tg-action {
      background-color: #24a1de;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="tg-wrapper">
    <div class="tg-notice">
      <div class="tg-notice-badge">How To Join</div>
      <p class="tg-notice-text"><span>1st Click:</span> Ad &nbsp;|&nbsp; <span>2nd Click:</span> Channel Link</p>
    </div>

    <div class="tg-stack" id="tgButtons"></div>
  </div>

  <script>
    // यहाँ अपनी Monetization Ad लिंक डालें (यह सभी बटन पर काम करेगी)
    const adUrl = "https://hai8g.com/4/9343270";

    // यहाँ अपनी Telegram लिंक्स और बटन का नाम डालें (जितने चाहें उतने बढ़ा सकते हैं)
    const telegramLinks = [
      { label: "Join Channel 1", url: "https://t.me/+y41Me-xL1qRjOTJl" },
      { label: "Join Channel 2", url: "https://t.me/+6t0UZycs_dFjNTA1" },
      { label: "Join Channel 3", url: "https://t.me/+sf0M0aT1dgRmMjFl" },
      { label: "Join Channel 4", url: "https://t.me/+WbZqRE6gpYw5Zjdl" },
      { label: "Join Channel 5", url: "https://t.me/+40CMI89Ii7dhOWNl" },
      { label: "Join Channel 6", url: "https://t.me/+s9S-Jt2JZbw2YTg1" }
    ];

    const tgIconSvg = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l16.01-6.16c.73-.3 1.4.18 1.15 1.32l-2.72 12.81c-.19.91-.74 1.13-1.5.71l-4.14-3.05-2 1.92c-.22.22-.41.41-.84.41z"/>
      </svg>
    `;

    const container = document.getElementById("tgButtons");
    const clickedOnce = new Set();

    function openTargetUrl(targetUrl) {
      const link = document.createElement("a");
      link.href = targetUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    telegramLinks.forEach((item, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tg-btn";
      button.innerHTML = `
        <div class="tg-left">
          <div class="tg-badge">${tgIconSvg}</div>
          <span class="tg-title">${item.label}</span>
        </div>
        <span class="tg-action">OPEN</span>
      `;

      button.addEventListener("click", () => {
        if (!item.url || item.url.includes("your_channel_")) {
          alert("कृपया कोड में अपनी असली Telegram लिंक डालें।");
          return;
        }

        if (!clickedOnce.has(index)) {
          clickedOnce.add(index);
          button.classList.add("unlocked");
          button.querySelector(".tg-action").textContent = "JOIN";
          openTargetUrl(adUrl);
        } else {
          openTargetUrl(item.url);
        }
      });

      container.appendChild(button);
    });
  </script>
</body>
</html>
